<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .t  { font-size: 15px; fill: #0f172a; }
      .s  { font-size: 12.5px; fill: #475569; }
      .h  { font-size: 17px; font-weight: 600; fill: #0f172a; }
      .hw { font-size: 15px; font-weight: 600; fill: #ffffff; }
      .lbl{ font-size: 12.5px; fill: #1e293b; }
      .lb { font-size: 12.5px; fill: #1d4ed8; font-weight: 600; }
      .box{ fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .ln { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
      .lnB{ stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrB); stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Todo Summary Assistant: AWS deployment architecture</text>
  <text x="40" y="74" class="s">Push to main → GitHub Actions tests, builds and pushes images, then deploys to EC2 over SSM. App data on private RDS MySQL. Prometheus + Grafana on the same host.</text>

  <!-- ===== Left column: people & CI ===== -->
  <rect x="40" y="110" width="250" height="70" class="box"/>
  <text x="60" y="140" class="h">Developer</text>
  <text x="60" y="162" class="s">git push / pull request</text>

  <rect x="40" y="230" width="250" height="250" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="258" class="h">GitHub Actions (ci-cd.yml)</text>
  <text x="60" y="288" class="t">1. backend-test (Maven + MySQL)</text>
  <text x="60" y="312" class="t">2. frontend-test (npm test + build)</text>
  <text x="60" y="336" class="t">3. docker build, tag :&lt;git sha&gt;</text>
  <text x="60" y="360" class="t">4. push to Docker Hub (main only)</text>
  <text x="60" y="384" class="t">5. deploy: SSM Run Command</text>
  <text x="60" y="408" class="t">6. health check APP_URL</text>
  <text x="60" y="440" class="s">Secrets: DOCKERHUB_TOKEN,</text>
  <text x="60" y="458" class="s">AWS_DEPLOY_ROLE_ARN (OIDC, no keys)</text>

  <rect x="40" y="530" width="250" height="70" class="box"/>
  <text x="60" y="560" class="h">Docker Hub</text>
  <text x="60" y="582" class="s">todo-backend / todo-frontend :sha</text>

  <rect x="40" y="680" width="250" height="70" class="box"/>
  <text x="60" y="710" class="h">End users</text>
  <text x="60" y="732" class="s">browser → http://&lt;EIP&gt;</text>

  <rect x="40" y="790" width="250" height="70" class="box"/>
  <text x="60" y="820" class="h">Admin (your IP only)</text>
  <text x="60" y="842" class="s">Grafana :3000, SSH :22 / SSM session</text>

  <!-- ===== AWS region ===== -->
  <rect x="360" y="100" width="1200" height="860" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="128" class="h" fill="#9a3412">AWS Region (ap-south-1)</text>

  <!-- regional services -->
  <rect x="1250" y="150" width="290" height="300" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1270" y="178" class="h">IAM</text>
  <text x="1270" y="204" class="t">todo-app-ec2 role</text>
  <text x="1270" y="224" class="s">SSMManagedInstanceCore +</text>
  <text x="1270" y="242" class="s">read /todo-app/* parameters</text>
  <text x="1270" y="272" class="t">todo-app-github-deploy role</text>
  <text x="1270" y="292" class="s">trusted: GitHub OIDC, repo + env</text>
  <text x="1270" y="310" class="s">ssm:SendCommand on this instance</text>
  <line x1="1270" y1="330" x2="1520" y2="330" stroke="#e2e8f0"/>
  <text x="1270" y="356" class="h">SSM Parameter Store</text>
  <text x="1270" y="380" class="s">/todo-app/SPRING_DATASOURCE_*</text>
  <text x="1270" y="398" class="s">/todo-app/COHERE_API_KEY (SecureString)</text>
  <text x="1270" y="416" class="s">/todo-app/SLACK_WEBHOOK_URL, GRAFANA_*</text>
  <text x="1270" y="434" class="s">→ rendered to .env by deploy.sh</text>

  <!-- VPC -->
  <rect x="390" y="150" width="830" height="780" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="410" y="178" class="h" fill="#166534">Default VPC</text>

  <!-- EC2 SG -->
  <rect x="420" y="195" width="770" height="470" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="440" y="222" class="h" fill="#991b1b">Security group: todo-app-ec2</text>
  <text x="440" y="244" class="s">in: 80 from 0.0.0.0/0 · 22 and 3000 from admin_cidr only · out: all</text>

  <!-- EC2 instance -->
  <rect x="445" y="260" width="720" height="385" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
  <text x="465" y="288" class="h">EC2 t3.small · Amazon Linux 2023 · IMDSv2 · Elastic IP</text>
  <text x="465" y="308" class="s">Docker Compose stack in /opt/todo-app (scripts/deploy.sh: pull → up → health gate → auto-rollback)</text>

  <rect x="470" y="325" width="200" height="80" rx="6" fill="#2563eb"/>
  <text x="485" y="355" class="hw">frontend (nginx)</text>
  <text x="485" y="378" font-size="12.5" fill="#dbeafe">host :80 → :8080, non-root</text>
  <text x="485" y="395" font-size="12.5" fill="#dbeafe">static React + /api proxy</text>

  <rect x="720" y="325" width="200" height="80" rx="6" fill="#2563eb"/>
  <text x="735" y="355" class="hw">backend (Spring Boot)</text>
  <text x="735" y="378" font-size="12.5" fill="#dbeafe">:8080 internal only</text>
  <text x="735" y="395" font-size="12.5" fill="#dbeafe">/actuator/prometheus</text>

  <rect x="470" y="450" width="140" height="60" rx="6" fill="#ea580c"/>
  <text x="485" y="476" class="hw">Prometheus</text>
  <text x="485" y="497" font-size="12.5" fill="#ffedd5">127.0.0.1:9090</text>

  <rect x="630" y="450" width="140" height="60" rx="6" fill="#ea580c"/>
  <text x="645" y="476" class="hw">Alertmanager</text>
  <text x="645" y="497" font-size="12.5" fill="#ffedd5">→ Slack #ops</text>

  <rect x="790" y="450" width="130" height="60" rx="6" fill="#f59e0b"/>
  <text x="805" y="476" class="hw">Grafana</text>
  <text x="805" y="497" font-size="12.5" fill="#fffbeb">queries Prometheus</text>

  <rect x="470" y="560" width="160" height="60" rx="6" fill="#64748b"/>
  <text x="485" y="586" class="hw">node-exporter</text>
  <text x="485" y="607" font-size="12.5" fill="#f1f5f9">host CPU/mem/disk</text>

  <rect x="650" y="560" width="160" height="60" rx="6" fill="#64748b"/>
  <text x="665" y="586" class="hw">cAdvisor</text>
  <text x="665" y="607" font-size="12.5" fill="#f1f5f9">container metrics</text>

  <rect x="960" y="325" width="185" height="150" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="975" y="350" class="t" font-weight="600">SSM agent</text>
  <text x="975" y="372" class="s">receives deploy command</text>
  <text x="975" y="390" class="s">from GitHub Actions</text>
  <text x="975" y="418" class="t" font-weight="600">Instance role</text>
  <text x="975" y="440" class="s">reads SSM params,</text>
  <text x="975" y="458" class="s">no AWS keys on disk</text>

  <!-- RDS SG -->
  <rect x="420" y="700" width="770" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="440" y="727" class="h" fill="#1e3a8a">Security group: todo-app-rds</text>
  <text x="440" y="749" class="s">in: 3306 only from security group todo-app-ec2 · publicly_accessible = false</text>
  <rect x="445" y="768" width="720" height="110" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="465" y="798" class="h">RDS MySQL 8.0 (db.t3.micro) · database todo_db</text>
  <text x="465" y="822" class="s">Private (DB subnet group) · storage encrypted · automated backups + PITR · final snapshot on delete</text>
  <text x="465" y="842" class="s">Multi-AZ standby: toggle db_multi_az = true for production</text>
  <text x="465" y="862" class="s">Credentials: random password → SSM SecureString → container env (never in git)</text>

  <!-- External SaaS -->
  <rect x="1250" y="560" width="290" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1270" y="590" class="h">External APIs (HTTPS)</text>
  <text x="1270" y="614" class="t">Cohere: summarize todos</text>
  <text x="1270" y="638" class="t">Slack webhooks: summaries + alerts</text>

  <!-- ===== arrows ===== -->
  <path d="M165,180 V230" class="ln"/>
  <path d="M165,480 V530" class="ln"/>
  <text x="175" y="510" class="lbl">push :sha</text>

  <!-- CI -> SSM agent via deploy role -->
  <path d="M290,424 H325 V92 H1052 V323" class="lnB"/>
  <text x="1044" y="172" class="lb" text-anchor="end">OIDC → AssumeRole</text>
  <text x="1044" y="189" class="lb" text-anchor="end">→ ssm:SendCommand</text>

  <!-- Docker Hub -> EC2 pull -->
  <path d="M290,575 H443" class="ln"/>
  <text x="300" y="566" class="lbl">docker pull :sha</text>

  <!-- users -> frontend -->
  <path d="M290,715 H405 V390 H468" class="ln"/>
  <text x="300" y="706" class="lbl">HTTP :80</text>

  <!-- admin -> grafana -->
  <path d="M290,825 H378 V682 H855 V512" class="ln"/>
  <text x="300" y="816" class="lbl">:3000 / :22</text>

  <!-- frontend -> backend -->
  <path d="M670,365 H718" class="ln"/>
  <text x="676" y="355" class="lbl">/api</text>

  <!-- backend -> RDS -->
  <path d="M920,390 H940 V766" class="ln"/>
  <text x="948" y="560" class="lbl">JDBC :3306</text>

  <!-- prometheus scrapes -->
  <path d="M560,450 C 600,420 760,430 790,405" class="ln"/>
  <text x="590" y="432" class="lbl">scrape</text>
  <path d="M530,560 V512" class="ln"/>
  <path d="M700,560 C 640,540 600,530 580,512" class="ln"/>
  <path d="M610,480 H628" class="ln"/>

  <!-- host egress -> external apis -->
  <path d="M1165,615 H1248" class="ln"/>
  <text x="1172" y="606" class="lbl">HTTPS</text>

  <!-- EC2 role -> SSM params -->
  <path d="M1145,420 H1248" class="lnB"/>
</svg>
