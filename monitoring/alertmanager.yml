# Routes Prometheus alerts to Slack. The webhook URL is never in git: it is mounted as a
# compose secret (from ALERT_SLACK_WEBHOOK_URL, which deploy.sh loads from SSM).
route:
  receiver: slack
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /run/secrets/alert_slack_webhook
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

inhibit_rules:
  # If the backend is down, don't also page for its error rate / latency
  - source_matchers: [alertname="BackendDown"]
    target_matchers: [alertname=~"HighErrorRate|HighLatencyP95"]
